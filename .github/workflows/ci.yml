name: Stabilization checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - npm run build --workspace frontend
          - npm test --workspace frontend -- --run
          - npm run lint --workspace frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookmarks_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['55438:5432']
        options: --health-cmd 'pg_isready -U test -d bookmarks_test' --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['56388:6379']
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:55438/bookmarks_test
      TEST_REDIS_URL: redis://localhost:56388/3
      REDIS_URL: redis://localhost:56388/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: createdb -h localhost -p 55438 -U test bookmarks_migration_test
        env:
          PGPASSWORD: test
      - run: python scripts/check_migrations.py
        working-directory: backend
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://test:test@localhost:55438/bookmarks_migration_test
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m ruff check app tests
        if: always()
        working-directory: backend
      - run: python -m mypy app
        if: always()
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: python scripts/check_api_client.py
        working-directory: backend
